<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piano</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <h1>Piano Virtual</h1>
    <section class="teclado">
    <!-- 1ª Oitava (Grave) -->
    <input class="tecla" data-nota="C3" type="button" value="Dó">
    <input class="tecla preta" data-nota="Db3" type="button" value="Dó&#10;Ré♭">
    <input class="tecla" data-nota="D3" type="button" value="Ré">
    <input class="tecla preta" data-nota="Eb3" type="button" value="Ré&#10;Mi♭">
    <input class="tecla" data-nota="E3" type="button" value="Mi">
    <input class="tecla" data-nota="F3" type="button" value="Fá">
    <input class="tecla preta" data-nota="Gb3" type="button" value="Fá&#10;Sol♭">
    <input class="tecla" data-nota="G3" type="button" value="Sol">
    <input class="tecla preta" data-nota="Ab3" type="button" value="Sol&#10;Lá♭">
    <input class="tecla" data-nota="A3" type="button" value="Lá">
    <input class="tecla preta" data-nota="Bb3" type="button" value="Lá&#10;Si♭">
    <input class="tecla" data-nota="B3" type="button" value="Si">

    <!-- 2ª Oitava (Média) -->
    <input class="tecla" data-nota="C4" type="button" value="Dó">
    <input class="tecla preta" data-nota="Db4" type="button" value="Dó&#10;Ré♭">
    <input class="tecla" data-nota="D4" type="button" value="Ré">
    <input class="tecla preta" data-nota="Eb4" type="button" value="Ré&#10;Mi♭">
    <input class="tecla" data-nota="E4" type="button" value="Mi">
    <input class="tecla" data-nota="F4" type="button" value="Fá">
    <input class="tecla preta" data-nota="Gb4" type="button" value="Fá&#10;Sol♭">
    <input class="tecla" data-nota="G4" type="button" value="Sol">
    <input class="tecla preta" data-nota="Ab4" type="button" value="Sol&#10;Lá♭">
    <input class="tecla" data-nota="A4" type="button" value="Lá">
    <input class="tecla preta" data-nota="Bb4" type="button" value="Lá&#10;Si♭">
    <input class="tecla" data-nota="B4" type="button" value="Si">

    <!-- 3ª Oitava (Aguda) -->
    <input class="tecla" data-nota="C5" type="button" value="Dó">
    <input class="tecla preta" data-nota="Db5" type="button" value="Dó&#10;Ré♭">
    <input class="tecla" data-nota="D5" type="button" value="Ré">
    <input class="tecla preta" data-nota="Eb5" type="button" value="Ré&#10;Mi♭">
    <input class="tecla" data-nota="E5" type="button" value="Mi">
    <input class="tecla" data-nota="F5" type="button" value="Fá">
    <input class="tecla preta" data-nota="Gb5" type="button" value="Fá&#10;Sol♭">
    <input class="tecla" data-nota="G5" type="button" value="Sol">
    <input class="tecla preta" data-nota="Ab5" type="button" value="Sol&#10;Lá♭">
    <input class="tecla" data-nota="A5" type="button" value="Lá">
    <input class="tecla preta" data-nota="Bb5" type="button" value="Lá&#10;Si♭">
    <input class="tecla" data-nota="B5" type="button" value="Si">
</section>
    
</body>
</html>
